modLoader="javafml"
loaderVersion="${neo_loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issueTrackerURL}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    #updateJSONURL="${mod_updateJSONURL}"
    displayURL="${mod_displayURL}"
    logoFile="${mod_id}.png"
    credits="${mod_credits}"
    authors="${mod_authors}"
    description='''${mod_description}'''

[[mixins]]
config="${mod_id}-common.mixins.json"
[[mixins]]
config="${mod_id}-neoforge.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"